services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      # Your CS2 demo folder. The container path (/demos) is what you enter in
      # the Sync Folder UI; the host side comes from DEMO_HOST_DIR in .env, so
      # the default no longer assumes a Windows Steam install — see .env.example.
      #
      # Mounted rw, not ro: Sync Folder only reads, but Fetch from Steam writes
      # downloaded demos here. Change to :ro if you never use the fetcher.
      - "${DEMO_HOST_DIR:-C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/replays}:/demos:rw"
    environment:
      - DB_PATH=/app/data/pr1mealazyer.db
      # Where the fetcher writes demos inside the container. Matches the mount
      # above so Sync Folder finds them straight away.
      - DEMO_DIR=/demos
