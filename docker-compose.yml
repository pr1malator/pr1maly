services:
  api:
    build: .
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      # Your CS2 demo folder, at /demos inside the container — the path you
      # enter in the Sync Folder UI.
      #
      # The default is a folder in this directory, because a default has to
      # work on the machine it lands on. It used to be the Windows Steam path,
      # which on macOS and Linux is not a path at all: the daemon rejects it
      # with "invalid volume specification" and the app never starts. Point
      # DEMO_HOST_DIR at your real Steam folder in .env — see .env.example for
      # where that is on each platform.
      #
      # Mounted rw, not ro: Sync Folder only reads, but Fetch from Steam writes
      # downloaded demos here. Change to :ro if you never use the fetcher.
      - "${DEMO_HOST_DIR:-./demos}:/demos:rw"
    environment:
      - DB_PATH=/app/data/pr1mealazyer.db
      # Where the fetcher writes demos inside the container. Matches the mount
      # above so Sync Folder finds them straight away.
      - DEMO_DIR=/demos
