services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      # Mount your CS2 demo folder for sync. Adjust the host path to your demo location.
      # The container path (/demos) is what you enter in the Sync Folder UI.
      # Mounted rw, not ro: Sync Folder only reads, but Fetch from Steam writes
      # downloaded demos here. Change to :ro if you never use the fetcher.
      - "C:/Program Files (x86)/Steam/steamapps/common/Counter-Strike Global Offensive/game/csgo/replays:/demos:rw"
    environment:
      - DB_PATH=/app/data/pr1mealazyer.db
      # Where the fetcher writes demos inside the container. Matches the mount
      # above so Sync Folder finds them straight away.
      - DEMO_DIR=/demos
